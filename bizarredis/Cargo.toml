[package]
name = "bizarredis"
version = "0.1.9"
edition = "2024"

[dependencies]
tokio = { version = "~1.52", features = ["full"] }
socket2 = { version = "~0.6.4" }
once_cell = { version = "~1.21.4" }
env_logger = { version = "~0.11" }
futures = { version = "~0.3" }
chrono = { version = "~0.4" }
log = { version = "~0.4", features = ["std", "serde"] }
bytes = { version = "~1.12"}
rand = { version = "~0.10" }
uuid = { version = "~1.23", features = ["v4", "serde"] }
sha1 = { version = "~0.11" }
bincode = { version = "~1.3" }
aes-gcm = { version = "~0.11" }
hex = { version = "~0.4" }
serde = { version = "~1.0", features = ["derive"] }
sha2 = { "version" = "~0.11" }
ipnetwork = { "version" = "~0.21.1" }
memory-stats = { "version" = "1.1.0" }
