[package]
name = "someqtt"
version = "0.1.4"
edition = "2024"

[dependencies]
bytes = { version = "~1.12"}
uuid = { version = "~1.26", features = ["v4", "serde"] }
log = { version = "~0.4", features = ["std", "serde"] }
tokio = { version = "~1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
once_cell = { version = "~1.21.4" }
env_logger = { version = "~0.11" }
chrono = { version = "~0.4" }
aes-gcm = { version = "~0.11" }
hex = { version = "*" }
rand = { version = "~0.10" }
sha1 = "~0.11"
ipnetwork = "~0.21"
gethostname = { version = "~1.1" }
ctrlc = { version = "*" }
memory-stats = { version = "~1.2" }
