[package]
name = "socket_phone"
# copy of main project version
version = "0.1.9"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "~0.21"
tokio = { version = "~1", features = ["full"] }
log = "~0.4"
android_logger = "~0.15"
chrono = { version = "~0.4" }
bytes = { version = "~1.12"}
socket2 = { version = "~0.6.5" }
rand = { version = "~0.10" }
uuid = { version = "~1.24", features = ["v4", "serde"] }
sha1 = { version = "~0.11" }
bincode = { version = "~1.3" }
aes-gcm = { version = "~0.11" }
hex = { version = "~0.4" }
serde = { version = "~1.0", features = ["derive"] }
sha2 = { "version" = "~0.11" }
memory-stats = { "version" = "1.2.0" }
once_cell = { "version" = "~1.21" }
